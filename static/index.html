<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通信知识库 RAG 问答</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --primary: #185FA5;
      --primary-light: #E6F1FB;
      --text: #1f2329;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #0F6E56;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: 720px;
      max-width: 92vw;
      height: 88vh;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--primary-light);
    }
    header h1 { font-size: 17px; font-weight: 600; color: var(--primary); }
    header p { font-size: 12px; color: var(--muted); margin-top: 4px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg { max-width: 82%; padding: 12px 16px; border-radius: 12px; line-height: 1.65; font-size: 14px; }
    .msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: #f0f2f5; border-bottom-left-radius: 4px; }
    .msg.bot .sources { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--muted); }
    .msg.bot .sources li { margin-left: 18px; margin-top: 4px; }
    .msg.bot .sources .tag { color: var(--accent); font-weight: 600; }
    .loading { color: var(--muted); font-size: 13px; align-self: flex-start; }
    footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    #input:focus { border-color: var(--primary); }
    #send {
      padding: 0 22px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    #send:hover { opacity: 0.9; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>通信知识库 RAG 问答</h1>
      <p>基于 ChromaDB 检索 + 通义千问生成 · 500 条通信专业语料</p>
    </header>
    <div id="chat"></div>
    <footer>
      <input id="input" type="text" placeholder="输入通信相关问题，比如：5G 的数据信道用什么编码？" />
      <button id="send">发送</button>
    </footer>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMsg(text, who, sources) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      if (sources && sources.length) {
        const s = document.createElement('div');
        s.className = 'sources';
        s.innerHTML = '<span class="tag">检索到的资料</span>';
        const ul = document.createElement('ul');
        sources.forEach(src => {
          const li = document.createElement('li');
          li.textContent = src;
          ul.appendChild(li);
        });
        s.appendChild(ul);
        div.appendChild(s);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addLoading() {
      const div = document.createElement('div');
      div.className = 'loading';
      div.textContent = '检索中…';
      div.id = 'loading';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function ask() {
      const q = input.value.trim();
      if (!q) return;
      addMsg(q, 'user');
      input.value = '';
      send.disabled = true;
      addLoading();
      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q })
        });
        const data = await resp.json();
        document.getElementById('loading')?.remove();
        addMsg(data.answer, 'bot', data.sources);
      } catch (e) {
        document.getElementById('loading')?.remove();
        addMsg('出错了：' + e.message, 'bot');
      } finally {
        send.disabled = false;
      }
    }

    send.addEventListener('click', ask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
  </script>
</body>
</html>
